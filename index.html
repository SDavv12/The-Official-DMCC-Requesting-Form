<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Item Request Form</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#677385;--bd:#d9dee5;--ac:#0f766e;--ac2:#e6f4f2;--wa:#b45309;--er:#b42318;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222b;--tx:#e8edf3;--mu:#93a0b2;--bd:#2f3946;--ac:#2dd4bf;--ac2:#16322f;--wa:#fbbf24;--er:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222b;--tx:#e8edf3;--mu:#93a0b2;--bd:#2f3946;--ac:#2dd4bf;--ac2:#16322f;--wa:#fbbf24;--er:#f97066;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.hd{border-top:8px solid var(--ac);background:var(--card);border-radius:10px;padding:20px;margin-bottom:12px;border:1px solid var(--bd);border-top:8px solid var(--ac)}
h1{margin:0 0 4px;font-size:24px}.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:12px}
label.l{display:block;font-weight:600;margin-bottom:6px}.rq{color:var(--er)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:560px){.g{grid-template-columns:1fr}}
.f{margin-bottom:14px}.f:last-child{margin-bottom:0}
.ch{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
:root[data-theme="dark"] .chip.on{color:#05211e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#05211e}}
.lst{max-height:280px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px}
.it{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.it .cd{font-size:12px;color:var(--mu);min-width:46px;font-variant-numeric:tabular-nums}.it .nm{flex:1}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 12px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;padding:10px 20px}
:root[data-theme="dark"] button.p{color:#05211e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#05211e}}
button:disabled{opacity:.5;cursor:default}
.ln{display:grid;grid-template-columns:1fr 80px 100px 32px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.ln:last-child{border:0}.ln .nm small{display:block;color:var(--mu)}
.ln .x{padding:4px;color:var(--er)}
@media(max-width:560px){.ln{grid-template-columns:1fr 70px 90px 30px}}
.em{color:var(--mu);text-align:center;padding:16px}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.bd.u{background:transparent;border:1px solid var(--wa);color:var(--wa)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.msg{padding:12px 14px;border-radius:8px;margin-bottom:12px;background:var(--ac2);color:var(--tx);border:1px solid var(--ac)}
.msg.w2{border-color:var(--wa);background:transparent}
.err{color:var(--er);font-size:13px;margin-top:6px}
.rc{border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:10px}
.rc.dn{opacity:.6}.rc ul{margin:8px 0 0;padding-left:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hid{display:none}
.ldg{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg button{margin-left:6px;padding:3px 10px}
[hidden]{display:none!important}
.ub{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;font-size:14px;color:var(--mu)}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px}
html[lang="km"] body,html[lang="km"] input,html[lang="km"] select,html[lang="km"] textarea,html[lang="km"] button{font-family:"Noto Sans Khmer","Khmer UI","Leelawadee UI","Khmer OS Battambang",system-ui,sans-serif}
html[lang="km"] body{line-height:1.75}
html[lang="km"] input,html[lang="km"] select,html[lang="km"] button{line-height:1.6}
html[lang="km"] .rf{letter-spacing:0}
.slip .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid var(--ac);padding-bottom:10px;margin-bottom:12px}
.slip h2{margin:0;font-size:20px}.slip .org{color:var(--mu);font-size:13px}
.slip .rf{font-size:22px;font-weight:700;color:var(--ac);letter-spacing:.5px;white-space:nowrap}
.slip table{width:100%;border-collapse:collapse;font-size:14px}
.slip .kv td{padding:4px 0;vertical-align:top}.slip .kv td:first-child{color:var(--mu);width:130px}
.slip .tb{margin-top:14px}
.slip .tb th,.slip .tb td{border:1px solid var(--bd);padding:6px 8px;text-align:left}
.slip .tb th{background:var(--ac2)}.slip .tb .n{text-align:right;width:56px}
.slip .nt{margin-top:12px;font-size:14px}
.slip .sig{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:48px}
.slip .sig div{border-top:1px solid var(--tx);padding-top:6px;font-size:13px;color:var(--mu)}
@media print{
@page{margin:14mm}
:root:root:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#444;--bd:#999;--ac:#000;--ac2:#eee;color-scheme:light}
body{background:#fff}
.hd,#note,#vf,#lg,.noprint{display:none!important}
.w{max-width:none;padding:0}
#done .c{border:0;padding:0}
}
</style></head>
<body><div class="w">
<div class="hd"><div class="lang noprint" id="lang"><button class="chip" data-l="en">English</button><button class="chip" data-l="km">ខ្មែរ</button></div><h1 data-i18n="title">Item Request Form</h1><div class="mu" data-i18n-html="subtitle">Select the items you need, enter quantities, and submit. Fields marked <span class="rq">*</span> are required.</div></div>
<div id="note"></div>

<div id="lg" hidden>
<div class="c">
<div class="f"><label class="l" for="luI" data-i18n="login.user">Username</label><input id="luI" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Your department username" data-i18n-ph="login.user.ph"></div>
<div class="f" style="margin-top:12px"><label class="l" for="lpI" data-i18n="login.pass">Password</label><input id="lpI" type="password" autocomplete="current-password" placeholder="Password" data-i18n-ph="login.pass.ph"></div>
<div class="row" style="margin-top:14px;justify-content:flex-start"><button class="p" id="lgb" data-i18n="login.btn">Log in</button></div>
<div class="err" id="lge"></div>
</div></div>
<div class="ub noprint" id="ub" hidden><span><span data-i18n="ub.as">Logged in as</span> <b id="ubU"></b> (<span id="ubD"></span>)</span><button id="lgo" data-i18n="ub.out">Log out</button></div>

<div id="vf" hidden>
<div class="c"><div class="g">
<div class="f"><label class="l" for="nmI" data-i18n-html="f.name">Your name <span class="rq">*</span></label><input id="nmI" autocomplete="name" placeholder="Full name" data-i18n-ph="f.name.ph"></div>
<div class="f"><label class="l" for="dpI" data-i18n-html="f.dept">Department / ward <span class="rq">*</span></label>
<select id="dpI"><option value="">Choose…</option></select></div>
<div class="f"><label class="l" for="prI" data-i18n="f.prio">Priority</label><select id="prI"><option value="Normal" data-i18n="prio.Normal">Normal</option><option value="Urgent" data-i18n="prio.Urgent">Urgent</option></select></div>
</div></div>

<div class="c"><label class="l" data-i18n-html="f.find">Find items <span class="rq">*</span></label>
<input id="q" type="search" placeholder="Search by name or code (e.g. paracetamol, S0248)" data-i18n-ph="f.find.ph">
<div class="ch" id="chips"></div>
<div class="lst" id="lst"><div class="em">Loading items…</div></div>
<div class="mu" id="rs" style="margin-top:6px"></div></div>

<div class="c"><label class="l" data-i18n-html="f.req">Requested items (<span id="n">0</span>)</label><div id="cart"></div></div>

<div class="c"><div class="f"><label class="l" for="ntI" data-i18n="f.notes">Additional notes</label><textarea id="ntI" rows="3" placeholder="Anything else the store should know?" data-i18n-ph="f.notes.ph"></textarea></div></div>
<div class="row"><button class="p" id="sub" data-i18n="btn.submit">Submit request</button><button id="clr" data-i18n="btn.clear">Clear form</button></div>
<div class="err" id="er"></div>
</div>

<div class="tabs noprint" id="tabs" hidden><button id="tNew" data-i18n="tab.new">New request</button><button id="tReq" data-i18n="tab.req">Requests</button></div>
<div id="vr" hidden>
<div class="c"><div class="g">
<div class="f"><label class="l" for="rq" data-i18n="r.search">Search</label><input id="rq" type="search" placeholder="Reference, name, item…"></div>
<div class="f" id="rdw"><label class="l" for="rd" data-i18n="r.dept">Department</label><select id="rd"></select></div>
<div class="f"><label class="l" for="ra" data-i18n="r.from">From date</label><input id="ra" type="date"></div>
<div class="f"><label class="l" for="rb" data-i18n="r.to">To date</label><input id="rb" type="date"></div>
</div><div class="ch" id="rch"></div>
<div class="row"><span class="mu" id="rcnt"></span><span><button id="rrf" data-i18n="r.refresh">Refresh</button> <button class="p" id="rx" data-i18n="r.export">Download Excel</button></span></div></div>
<div id="rl"></div>
</div>
<div id="done" hidden>
<div class="msg noprint" id="doneMsg"></div>
<div class="c slip" id="slip"></div>
<div class="row noprint" style="justify-content:flex-start"><button class="p" id="prt" data-i18n="done.print">Print / Save as PDF</button><button id="newReq" data-i18n="done.new">New request</button></div>
</div>
<div class="mu noprint" style="text-align:center;margin:18px 0 6px"><span data-i18n="footer">Form version</span> 2026-11-08-j</div>

</div>

<script>document.write('<script src="config.js?t='+Date.now()+'"><\/script><script src="lang.js?t='+Date.now()+'"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
  onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<script>
const CFG=window.FORM_CONFIG||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG="en",LOADED=false,LOADPROB=null,LASTDONE=null;
/* t(key, English text, {vars}): English text is the default; Khmer comes from lang.js */
function t(k,en,v){let s=en;if(LANG!=="en"){const d=(window.I18N&&window.I18N[LANG])||{};if(d[k]!=null)s=d[k]}
  if(v)for(const x in v)s=s.split("{"+x+"}").join(v[x]);return s}
const SRV={"Wrong username or password":"srv.wrong","Enter your username and password":"e.enter","Too many wrong attempts. Try again in 10 minutes.":"srv.locked","Missing fields":"srv.missing"};
const srvMsg=m=>SRV[m]?t(SRV[m],m):m;
const DEPTS=CFG.DEPT_ITEMS||[{dept:"Laboratory",file:"LAb_items.xlsx",cat:"Lab"}];   // departments that have their own item list
if(CFG.ORG_NAME)document.querySelector(".hd h1").insertAdjacentHTML("beforebegin",`<div class="mu" style="font-weight:600;margin-bottom:2px">${esc(CFG.ORG_NAME)}</div>`);
const UNITS=CFG.UNITS||["pcs"];
const deptCat=()=>{const d=$("dpI").value.trim().toLowerCase();const m=DEPTS.find(x=>x.dept.toLowerCase()==d);return m?m.cat:""};
const own=()=>DL[deptCat()]||[];
const deptOnly=()=>{const d=$("dpI").value.trim().toLowerCase();const m=DEPTS.find(x=>x.dept.toLowerCase()==d);return !!(m&&m.only)};   // "only: true" -> this department sees just its own list
const foreign=x=>Object.keys(DL).some(k=>k!=deptCat()&&DL[k].some(l=>l[0]==x.c&&l[1]==x.n));

let ITEMS=[],DL={},CATS=["All"];
let cat="All",cart=[],shown=[];

/* ---------- form setup ---------- */

/* ---------- load items from the Excel files ---------- */
function ensureXLSX(){
  return new Promise((ok,no)=>{let t=0;(function w(){if(window.XLSX)return ok();if((t+=100)>10000)return no(new Error("Excel reader (SheetJS) could not be loaded"));setTimeout(w,100)})()});
}
async function readSheet(file){
  const r=await fetch(file+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error(file+" not found (HTTP "+r.status+")");
  const wb=XLSX.read(await r.arrayBuffer(),{type:"array"});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
}
/* Accepts: "CODE - Name" in one cell, or code | name | (category) in separate cells.
   Blank rows, blank columns and a header row are skipped automatically. */
function parseRows(rows){
  const out=[];
  for(const row of rows){
    const cells=row.map(c=>typeof c==="number"?c:String(c).replace(/\s+/g," ").trim()).filter(c=>c!=="");
    if(!cells.length)continue;
    let code,name,cat,unit;
    if(cells.length==1){
      const m=String(cells[0]).match(/^([A-Za-z0-9]+)\s*[-–—]\s*(.+)$/);
      if(!m)continue;
      code=m[1];name=m[2];
    }else{code=cells[0];name=cells[1];cat=cells[2];unit=cells[3]}
    code=String(code);if(/^\d+$/.test(code))code=code.padStart(4,"0");          // Excel drops leading zeros: 127 -> 0127
    name=String(name).trim();
    if(/^(item\s*)?code$/i.test(code)||!name)continue;                       // header row
    out.push([code,name,typeof cat==="string"?cat:"",typeof unit==="string"?unit:""]);
  }
  return out;
}
function autoCat(code,name){
  if(/^S\d/i.test(code))return "Supplies";
  const n=name.toLowerCase();
  if(n.includes("vaccine"))return "Vaccines";
  if((CFG.MILK_WORDS||[]).some(w=>n.includes(String(w).toLowerCase())))return "Milk";
  return "Medicines";
}
async function loadItems(){
  LOADED=false;$("lst").innerHTML=`<div class="em">${esc(t("loading","Loading items…"))}</div>`;$("rs").textContent="";$("sub").disabled=true;
  const problems=[];
  try{await ensureXLSX()}catch(e){problems.push(e.message)}
  let act=[];const dl={};
  if(window.XLSX){
    const [a,...ls]=await Promise.allSettled([readSheet(CFG.ACTIVE_FILE)].concat(DEPTS.map(d=>readSheet(d.file))));
    if(a.status=="fulfilled"){act=parseRows(a.value).map(i=>[i[0],i[1],i[2]||autoCat(i[0],i[1])]);if(!act.length)problems.push(CFG.ACTIVE_FILE+" has no items (code in column 1, name in column 2)")}
    else problems.push(a.reason.message);
    ls.forEach((l,k)=>{const d=DEPTS[k];dl[d.cat]=[];
      if(l.status=="fulfilled"){dl[d.cat]=parseRows(l.value).map(i=>[i[0],i[1],d.cat,i[3]]);if(!dl[d.cat].length)problems.push(d.file+" has no items (use “CODE - Name” in column A)")}
      else problems.push(l.reason.message)});
  }
  ITEMS=act;DL=dl;
  const seen={};ITEMS.concat(...Object.values(DL)).forEach(i=>{(seen[i[0]]=seen[i[0]]||[]).push(i[1])});
  Object.keys(seen).filter(k=>seen[k].length>1).forEach(k=>console.warn("Duplicate item code "+k+":",seen[k]));
  const cs=[];(CFG.CATEGORY_ORDER||[]).forEach(c=>{if(ITEMS.some(i=>i[2]==c))cs.push(c)});
  ITEMS.forEach(i=>{if(!cs.includes(i[2]))cs.push(i[2])});
  CATS=["All"].concat(cs);
  if(!(cat in DL)&&!CATS.includes(cat))cat="All";
  LOADED=true;drawChips();list();
  $("sub").disabled=false;
  if(problems.length){LOADPROB={problems,local:location.protocol=="file:"};renderLoadNote()}
  else{LOADPROB=null;if($("note").querySelector("#retry"))note("")}
}
function renderLoadNote(){
  const p=LOADPROB;
  note("<b>"+esc(t("e.loadfail","Couldn’t load the item list."))+"</b> "+esc(p.problems.join("; "))+"."+(p.local?" "+esc(t("e.local","Open the page through GitHub Pages (or a local web server) – browsers block loading Excel files from a local file.")):"")+' <button id="retry">'+esc(t("e.retry","Try again"))+'</button>',true);
}

/* ---------- search / list ---------- */
function drawChips(){const dc=deptCat(),cs=deptOnly()?[]:dc?["All",dc].concat(CATS.slice(1)):CATS;$("chips").innerHTML=cs.map(c=>`<button class="chip${c==cat?" on":""}" data-c="${esc(c)}">${esc(t("cat."+c,c))}</button>`).join("")}
$("chips").onclick=e=>{const c=e.target.dataset.c;if(!c)return;cat=c;[...$("chips").children].forEach(b=>b.classList.toggle("on",b.dataset.c==c));list()};
$("q").oninput=list;

function list(){
  const qt=$("q").value.trim().toLowerCase();
  const r=(deptOnly()?own():own().concat(ITEMS)).filter(i=>(cat=="All"||i[2]==cat)&&(!qt||i[1].toLowerCase().includes(qt)||i[0].toLowerCase().includes(qt)));
  $("rs").textContent=LOADED?t(r.length==1?"n.item":"n.items",r.length==1?"{n} item":"{n} items",{n:r.length})+(r.length>80?t("more"," – showing first 80, refine your search"):""):"";
  $("lst").innerHTML=(shown=r.slice(0,80)).map((i,k)=>{const on=cart.some(x=>x.c==i[0]&&x.n==i[1]);return `<div class="it"><span class="cd">${esc(i[0])}</span><span class="nm">${esc(i[1])}</span><button data-a="${k}" ${on?"disabled":""}>${on?esc(t("added","Added")):esc(t("add","+ Add"))}</button></div>`}).join("")||`<div class="em">${esc(LOADED?t("none","No items found"):t("loading","Loading items…"))}</div>`;
}
$("lst").onclick=e=>{const c=e.target.dataset.a;if(c==null)return;const i=shown[+c];if(!i)return;cart.push({c:i[0],n:i[1],q:1,u:UNITS.includes(i[3])?i[3]:UNITS[0]});draw();list()};

/* ---------- cart ---------- */
function draw(){
  $("n").textContent=cart.length;
  $("cart").innerHTML=cart.length?cart.map((x,k)=>`<div class="ln"><div class="nm">${esc(x.n)}<small>${esc(x.c)}</small></div><input type="number" min="1" step="1" value="${x.q}" data-k="${k}" data-f="q" aria-label="${esc(t("qty","Quantity"))}"><select data-k="${k}" data-f="u" aria-label="${esc(t("unit","Unit"))}">${UNITS.map(u=>`<option value="${esc(u)}"${u==x.u?" selected":""}>${esc(t("unit."+u,u))}</option>`).join("")}</select><button class="x" data-r="${k}" aria-label="${esc(t("remove","Remove"))}">✕</button></div>`).join(""):`<div class="em">${esc(t("cart.empty","No items yet. Search above and tap “+ Add”."))}</div>`;
}
$("cart").oninput=e=>{const k=e.target.dataset.k;if(k==null)return;cart[k][e.target.dataset.f]=e.target.dataset.f=="q"?Math.max(0,parseInt(e.target.value)||0):e.target.value};
$("cart").onclick=e=>{const r=e.target.dataset.r;if(r==null)return;cart.splice(+r,1);draw();list()};

function reset(){cart=[];$("nmI").value="";$("ntI").value="";$("prI").value="Normal";$("er").textContent="";cat="All";drawChips();draw();list()}
$("clr").onclick=()=>{if(!cart.length||confirm(t("confirm.clear","Clear everything?")))reset()};

$("dpI").onchange=()=>{let m="";
  const n=cart.length;cart=cart.filter(x=>!foreign(x));if(cart.length<n)m=t("labremoved","Lab items were removed from your request because the department changed.");
  if(deptCat())cat=deptCat();else if(cat in DL)cat="All";
  drawChips();draw();list();note(m,!!m)};

function note(t,warn){$("note").innerHTML=t?`<div class="msg${warn?" w2":""}">${t}</div>`:""}
$("note").onclick=e=>{if(e.target.id=="retry")loadItems()};

/* ---------- submit -> Google Sheet ---------- */
const SHEET_URL=CFG.SHEET_URL||"";
let last={key:"",token:""};
function errText(e,pre){const m=String(e&&e.message||e);
  return m.startsWith("SERVER:")?(pre?t("e.srvpre",pre):"")+srvMsg(m.slice(7))
    :m=="BAD_REPLY"?t("e.bad","The Google Sheet link is not answering correctly. Please tell the admin (Apps Script must be deployed as a Web app with access set to “Anyone”).")
    :t("e.net","Couldn’t reach the Google Sheet. Please check your internet and try again. If it keeps happening, tell the admin.")}
async function api(body){
  const r=await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const t=await r.text();let j;
  try{j=JSON.parse(t)}catch(_){console.error("Non-JSON reply from SHEET_URL:",t.slice(0,300));throw new Error("BAD_REPLY")}
  return j;
}
$("sub").onclick=async()=>{
  const nm=$("nmI").value.trim(),dp=$("dpI").value;
  if(!SESS)return showLogin(t("e.login","Please log in."));
  if(!nm)return $("er").textContent=t("e.name","Please fill in your name.");
  if(!cart.length)return $("er").textContent=t("e.items","Please add at least one item.");
  if(cart.some(x=>x.q<1))return $("er").textContent=t("e.qty","Every item needs a quantity of at least 1.");
  if(!SHEET_URL||SHEET_URL.startsWith("PASTE"))return $("er").textContent=t("e.noconn","This form isn’t connected to a Google Sheet yet (SHEET_URL in config.js is not set).");
  $("er").textContent="";
  // dept is only used for the printed slip: the sheet always uses the department of the logged-in account
  const rec={name:nm,dept:dp,priority:$("prI").value,notes:$("ntI").value.trim(),items:cart.map(x=>({code:x.c,name:x.n,qty:x.q,unit:x.u}))};
  const key=JSON.stringify(rec);
  if(last.key!==key)last={key,token:"T"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
  rec.token=last.token;   // lets the sheet ignore an accidental double-send
  rec.session=SESS.token;
  $("sub").disabled=true;$("sub").textContent=t("btn.submitting","Submitting…");
  try{
    const j=await api(rec);
    if(!j.ok){if(j.auth)throw new Error("AUTH");throw new Error("SERVER:"+(j.error||"unknown error"))}
    const ref=j.ref,snap=rec;last={key:"",token:""};reset();note("");showDone(snap,ref,j.time);
  }catch(e){
    console.error(e);
    if(String(e&&e.message)=="AUTH")showLogin(t("e.expired","Your login has expired. Please log in again. Your request is still here."));
    else $("er").textContent=errText(e,"The Google Sheet reported a problem: ");
  }
  $("sub").disabled=false;$("sub").textContent=t("btn.submit","Submit request");
};

/* ---------- confirmation slip (print / save as PDF) ---------- */
function showDone(r,ref,time){
  LASTDONE={r,ref,when:time||new Date().toLocaleString("sv-SE",{timeZone:CFG.TIMEZONE||"Asia/Phnom_Penh"})};
  renderDone();$("vf").hidden=true;$("done").hidden=false;setTitle();scrollTo(0,0);
}
function renderDone(){
  const {r,ref,when}=LASTDONE;
  $("slip").innerHTML=`<div class="sh"><div><h2>${esc(t("slip.title","Item Request"))}</h2>${CFG.ORG_NAME?`<div class="org">${esc(CFG.ORG_NAME)}</div>`:""}</div><div class="rf">${ref?esc(ref):""}</div></div>
<table class="kv"><tr><td>${esc(t("slip.when","Date / time"))}</td><td>${esc(when)}</td></tr><tr><td>${esc(t("slip.by","Requested by"))}</td><td>${esc(r.name)}</td></tr><tr><td>${esc(t("slip.dept","Department"))}</td><td>${esc(r.dept)}</td></tr><tr><td>${esc(t("slip.prio","Priority"))}</td><td>${esc(t("prio."+r.priority,r.priority))}</td></tr></table>
<table class="tb"><tr><th class="n">${esc(t("slip.no","#"))}</th><th>${esc(t("slip.code","Code"))}</th><th>${esc(t("slip.item","Item"))}</th><th class="n">${esc(t("slip.qty","Qty"))}</th><th>${esc(t("slip.unit","Unit"))}</th></tr>${r.items.map((x,i)=>`<tr><td class="n">${i+1}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td class="n">${esc(x.qty)}</td><td>${esc(t("unit."+x.unit,x.unit))}</td></tr>`).join("")}</table>
${r.notes?`<div class="nt"><b>${esc(t("slip.notes","Notes:"))}</b> ${esc(r.notes)}</div>`:""}
<div class="sig"><div>${esc(t("slip.sig1","Requested by (name / signature / date)"))}</div><div>${esc(t("slip.sig2","Received by (name / signature / date)"))}</div></div>`;
  $("doneMsg").innerHTML=`<b>${esc(t("done.msg1","Request submitted."))}</b> `+(ref?`${esc(t("done.msg2","Your reference number is"))} <b>${esc(ref)}</b>. `:"")+esc(t("done.msg3","Print this page (or save it as PDF) and give it to the receiver to confirm."));
}
function setTitle(){document.title=!$("done").hidden&&LASTDONE?(LASTDONE.ref?LASTDONE.ref+" - ":"")+t("slip.title","Item Request"):t("title","Item Request Form")}
$("prt").onclick=()=>window.print();
$("newReq").onclick=()=>{$("done").hidden=true;$("vf").hidden=false;setTitle();scrollTo(0,0)};

/* ---------- login (department accounts are checked by the Google script) ---------- */
const SK="irf-session";
const getSess=()=>{try{return JSON.parse(sessionStorage.getItem(SK)||"null")}catch(e){return null}};
const setSess=v=>{try{v?sessionStorage.setItem(SK,JSON.stringify(v)):sessionStorage.removeItem(SK)}catch(e){}};
let SESS=getSess();
function showLogin(msg){SESS=null;setSess(null);$("vf").hidden=true;$("done").hidden=true;$("ub").hidden=true;$("tabs").hidden=true;$("vr").hidden=true;$("lg").hidden=false;$("lge").textContent=msg||"";$("lpI").value="";scrollTo(0,0)}
function showApp(){
  $("lg").hidden=true;$("ub").hidden=false;$("ubU").textContent=SESS.user;$("ubD").textContent=SESS.dept;
  $("dpI").innerHTML=`<option>${esc(SESS.dept)}</option>`;$("dpI").value=SESS.dept;$("dpI").disabled=true;   // department comes from the account
  const st=/^(stock|admin)$/i.test(SESS.role||"");$("tabs").hidden=!st;setView(st?"r":"n");   // only the stock team gets the Requests tab
  cart=cart.filter(x=>!foreign(x));if(deptCat())cat=deptCat();else if(cat in DL)cat="All";
  drawChips();draw();list();
}
$("lgb").onclick=async()=>{
  const u=$("luI").value.trim(),p=$("lpI").value;
  if(!u||!p)return $("lge").textContent=t("e.enter","Enter your username and password.");
  if(!SHEET_URL||SHEET_URL.startsWith("PASTE"))return $("lge").textContent=t("e.noconn","This form isn’t connected to a Google Sheet yet (SHEET_URL in config.js is not set).");
  $("lgb").disabled=true;$("lgb").textContent=t("login.checking","Checking…");$("lge").textContent="";
  try{
    const j=await api({action:"login",username:u,password:p});
    if(!j.ok)throw new Error("SERVER:"+(j.error||"Login failed"));
    SESS={token:j.token,dept:j.dept,user:j.user,role:j.role||""};setSess(SESS);
    $("luI").value="";$("lpI").value="";showApp();
  }catch(e){console.error(e);$("lge").textContent=errText(e,"")}
  $("lgb").disabled=false;$("lgb").textContent=t("login.btn","Log in");
};
$("luI").onkeydown=e=>{if(e.key==="Enter")$("lpI").focus()};
$("lpI").onkeydown=e=>{if(e.key==="Enter")$("lgb").click()};
$("lgo").onclick=()=>{
  if(cart.length&&!confirm(t("confirm.logout","Log out? Your current request will be cleared.")))return;
  if(SESS&&SHEET_URL)api({action:"logout",session:SESS.token}).catch(()=>{});
  reset();note("");showLogin("");setTitle();
};

/* ---------- requests: dashboard / status / history / Excel export ---------- */
let REQS=[],RSTAT=["Pending","Approved","Issued","Completed"],ISSTOCK=false,rst="All";
function setView(v){$("vf").hidden=v!="n";$("vr").hidden=v!="r";$("done").hidden=true;$("tNew").classList.toggle("on",v=="n");$("tReq").classList.toggle("on",v=="r");if(v=="r")loadReqs();setTitle()}
$("tNew").onclick=()=>setView("n");$("tReq").onclick=()=>setView("r");$("rrf").onclick=()=>loadReqs();
async function rcall(body){
  const j=await api(Object.assign({session:SESS.token},body));
  if(!j.ok){if(j.auth){showLogin(t("e.expired","Your login has expired. Please log in again. Your request is still here."));return null}throw new Error("SERVER:"+(j.error||"unknown error"))}
  return j;
}
async function loadReqs(){
  $("rl").innerHTML=`<div class="em">${esc(t("rload","Loading requests…"))}</div>`;
  try{const j=await rcall({action:"list"});if(!j)return;
    REQS=j.requests;ISSTOCK=j.stock;RSTAT=j.statuses;
    const cur=$("rd").value,ds=[...new Set(REQS.map(r=>r.dept))].sort();
    $("rd").innerHTML=`<option value="">${esc(t("r.alld","All departments"))}</option>`+ds.map(d=>`<option${d==cur?" selected":""}>${esc(d)}</option>`).join("");
    $("rdw").hidden=!ISSTOCK;drawReqs();
  }catch(e){console.error(e);$("rl").innerHTML=`<div class="err">${esc(errText(e,""))}</div>`}
}
const rf=()=>{const q=$("rq").value.trim().toLowerCase(),d=$("rd").value,a=$("ra").value,b=$("rb").value;
  return REQS.filter(r=>(!d||r.dept==d)&&(!a||r.time.slice(0,10)>=a)&&(!b||r.time.slice(0,10)<=b)&&(!q||(r.ref+" "+r.name+" "+r.dept+" "+r.items.map(i=>i.code+" "+i.name).join(" ")).toLowerCase().includes(q)))};
const rshow=()=>rf().filter(x=>rst=="All"||x.status==rst);
function drawReqs(){
  const base=rf();
  $("rch").innerHTML=["All"].concat(RSTAT).map(s=>`<button class="chip${s==rst?" on":""}" data-s="${esc(s)}">${esc(t("st."+s,s))} (${s=="All"?base.length:base.filter(r=>r.status==s).length})</button>`).join("");
  const r=rshow();$("rcnt").textContent=r.length+" "+t("r.n","requests");
  $("rl").innerHTML=r.map(x=>`<div class="rc"><div class="row"><b>${esc(x.ref)}</b><span class="bd${x.status=="Pending"?" u":""}">${esc(t("st."+x.status,x.status))}</span></div><div class="mu">${esc(x.time)} · ${esc(x.dept)} · ${esc(x.name)}${x.priority=="Urgent"?" · "+esc(t("prio.Urgent","Urgent")):""}</div><ul>${x.items.map(i=>`<li>${esc(i.name)} — ${esc(i.qty)} ${esc(t("unit."+i.unit,i.unit))}</li>`).join("")}</ul>${x.notes?`<div class="mu">${esc(x.notes)}</div>`:""}${ISSTOCK?`<div class="row" style="margin-top:8px;justify-content:flex-start"><select data-ref="${esc(x.ref)}" style="width:auto">${RSTAT.map(s=>`<option value="${esc(s)}"${s==x.status?" selected":""}>${esc(t("st."+s,s))}</option>`).join("")}</select>${RSTAT.indexOf(x.status)<RSTAT.length-1?`<button data-nx="${esc(x.ref)}">${esc(t("r.next","Next step"))} →</button>`:""}</div>`:""}</div>`).join("")||`<div class="em">${esc(t("r.none","No requests found"))}</div>`;
}
["rq","rd","ra","rb"].forEach(id=>{$(id).oninput=drawReqs;$(id).onchange=drawReqs});
$("rch").onclick=e=>{const s=e.target.dataset.s;if(!s)return;rst=s;drawReqs()};
async function setSt(ref,s){
  try{const j=await rcall({action:"setStatus",ref,status:s});if(!j)return;const r=REQS.find(x=>x.ref==ref);if(r){r.status=s}drawReqs()}
  catch(e){console.error(e);alert(errText(e,""));drawReqs()}
}
$("rl").onchange=e=>{const ref=e.target.dataset.ref;if(ref)setSt(ref,e.target.value)};
$("rl").onclick=e=>{const n=e.target.dataset.nx;if(n==null)return;const r=REQS.find(x=>x.ref==n);if(!r)return;const i=RSTAT.indexOf(r.status);if(i<RSTAT.length-1)setSt(n,RSTAT[i+1])};
$("rx").onclick=()=>{
  const r=rshow();if(!r.length||!window.XLSX)return;
  const rows=[["Ref","Date / time","Department","Requested by","Priority","Status","Item code","Item name","Qty","Unit","Notes"]];
  r.forEach(x=>x.items.forEach(i=>rows.push([x.ref,x.time,x.dept,x.name,x.priority,x.status,i.code,i.name,Number(i.qty)||0,i.unit,x.notes])));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Requests");
  XLSX.writeFile(wb,"requests-"+new Date().toISOString().slice(0,10)+".xlsx");
};

/* ---------- language (English / Khmer) ---------- */
const LK="irf-lang";
function loadKhmerFont(){if($("khf"))return;const l=document.createElement("link");l.id="khf";l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap";document.head.appendChild(l)}
function applyLang(){
  const K=(window.I18N&&window.I18N[LANG])||{};
  document.querySelectorAll("[data-i18n]").forEach(el=>{if(el.dataset.en==null)el.dataset.en=el.textContent;el.textContent=(LANG!=="en"&&K[el.dataset.i18n]!=null)?K[el.dataset.i18n]:el.dataset.en});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{if(el.dataset.en==null)el.dataset.en=el.innerHTML;el.innerHTML=(LANG!=="en"&&K[el.dataset.i18nHtml]!=null)?K[el.dataset.i18nHtml]:el.dataset.en});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{if(el.dataset.enPh==null)el.dataset.enPh=el.placeholder;el.placeholder=(LANG!=="en"&&K[el.dataset.i18nPh]!=null)?K[el.dataset.i18nPh]:el.dataset.enPh});
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  setTitle();drawChips();draw();list();
  if(LOADPROB)renderLoadNote();
  if(LASTDONE)renderDone();
}
function setLang(l,save){
  if(l!=="en"&&!(window.I18N&&window.I18N[l]))l="en";
  LANG=l;document.documentElement.lang=l;
  if(save){try{localStorage.setItem(LK,l)}catch(e){}}
  if(l==="km")loadKhmerFont();
  applyLang();
}
$("lang").hidden=!(window.I18N&&window.I18N.km);          // no lang.js uploaded -> no language button, English only
$("lang").onclick=e=>{const l=e.target.dataset&&e.target.dataset.l;if(l)setLang(l,true)};

drawChips();draw();loadItems();
SESS?showApp():showLogin("");
let savedLang=null;try{savedLang=localStorage.getItem(LK)}catch(e){}
setLang(savedLang||((navigator.language||"").toLowerCase().startsWith("km")?"km":"en"),false);
</script></body></html>
